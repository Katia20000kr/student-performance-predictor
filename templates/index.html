<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Performance Predictor</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <main class="page-shell">
        <section class="panel">
            <header class="page-header">
                <p class="eyebrow">AI Classification MVP</p>
                <h1>Student Performance Predictor</h1>
                <p class="intro">
                    Enter academic indicators to estimate whether a student is likely to pass or fail.
                </p>
            </header>

            <form class="prediction-form" action="{{ url_for('predict') }}" method="post">
                <label>
                    Study hours per week
                    <input type="number" name="study_hours" step="0.1" min="0" max="40" required>
                </label>

                <label>
                    Attendance percentage
                    <input type="number" name="attendance" step="0.1" min="0" max="100" required>
                </label>

                <label>
                    Previous grade
                    <input type="number" name="previous_grade" step="0.1" min="0" max="100" required>
                </label>

                <label>
                    Assignment completion score
                    <input type="number" name="assignment_score" step="0.1" min="0" max="100" required>
                </label>

                <button type="submit">Predict Result</button>
            </form>
        </section>
    </main>
</body>
</html>
